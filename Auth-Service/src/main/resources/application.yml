spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    username: admin
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  application:
    name: auth-service

server:
  port: 4040

jwt:
  secret: mysecretkeymysecretkeymysecretkey123
  access-token-expiry: 900000   # 15 min
  refresh-token-expiry: 604800000  # 7 days