# ======= Datasource for Testing =======
spring.datasource.url=jdbc:h2:mem:booking_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ======= JPA/Hibernate =======
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.sql.init.mode=never

# ======= Active Profiles =======
spring.profiles.active=test

# ======= Mock URLs =======
spring.inventoryService.url=http://localhost:8080
spring.roomService.url=http://localhost:8080
spring.billingService.url=http://localhost:8080
